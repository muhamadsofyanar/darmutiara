name: Laravel checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dar_test
          POSTGRES_USER: dar_test
          POSTGRES_PASSWORD: testing-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: testing
      APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: dar_test
      DB_USERNAME: dar_test
      DB_PASSWORD: testing-only-password
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, mbstring, gd, zip
          coverage: none
      - run: composer install --prefer-dist --no-interaction
      - run: composer validate --no-check-publish
      - run: php artisan view:cache
      - run: vendor/bin/phpunit
      - run: docker build -t dar-mutiara:ci .
      - name: Start production image against PostgreSQL
        run: |
          docker run -d --name dar-smoke --network host \
            -e APP_ENV=production -e APP_DEBUG=false -e APP_KEY="$APP_KEY" \
            -e APP_URL=http://localhost:8080 \
            -e DB_CONNECTION=pgsql -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
            -e DB_DATABASE=dar_test -e DB_USERNAME=dar_test -e DB_PASSWORD="$DB_PASSWORD" \
            -e SESSION_DRIVER=database -e CACHE_STORE=database -e QUEUE_CONNECTION=database \
            -e MAIL_MAILER=log dar-mutiara:ci
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8080/up; then break; fi
            sleep 2
          done
          curl --fail http://localhost:8080/
          docker exec dar-smoke php artisan migrate:status
      - if: failure()
        run: docker logs dar-smoke || true
